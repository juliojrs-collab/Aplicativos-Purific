<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#1a56db"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="AquaPure"/>
<title>AquaPure</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#f0f4f8;--surface:#fff;--surface2:#f7fafc;
  --blue:#1a56db;--blue-light:#ebf3ff;--blue-dark:#1241a8;
  --green:#0e9f6e;--green-light:#e6f6f0;
  --red:#e02424;--red-light:#fde8e8;
  --amber:#c27803;--amber-light:#fdf6b2;
  --purple:#7c3aed;--purple-light:#f0ebff;
  --teal:#0694a2;--teal-light:#e6f6f7;
  --text:#111827;--text2:#4b5563;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --r:12px;--r2:8px;--r3:20px;
  --sh:0 1px 3px rgba(0,0,0,.08);--sh2:0 4px 16px rgba(0,0,0,.12);
  --sidebar:220px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
#app{display:flex;min-height:100vh;}
#sidebar{width:var(--sidebar);background:linear-gradient(175deg,#1241a8,#1a56db 60%,#2563eb);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:40;transition:transform .25s;}
#main{margin-left:var(--sidebar);display:flex;flex-direction:column;min-height:100vh;flex:1;min-width:0;}
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;}
#topbar h1{font-size:15px;font-weight:600;flex:1;color:var(--text);}
#content{padding:20px;flex:1;}
.sb-logo{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.12);}
.sb-logo span{font-size:1.4rem;}.sb-logo h2{color:#fff;font-size:15px;font-weight:700;}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto;}
.sb-item{display:flex;align-items:center;gap:10px;padding:12px 16px;color:rgba(255,255,255,.7);cursor:pointer;transition:all .15s;border-left:3px solid transparent;font-size:13px;font-weight:500;user-select:none;}
.sb-item:hover{background:rgba(255,255,255,.1);color:#fff;}
.sb-item.active{background:rgba(255,255,255,.18);color:#fff;border-left-color:#fff;font-weight:700;}
.sb-item svg{width:18px;height:18px;flex-shrink:0;}
.sb-badge{background:var(--red);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:2px 6px;margin-left:auto;}
.sb-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);}
.sb-user{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.8);font-size:12px;}
.sb-user-ico{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.sb-logout{background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;padding:4px;border-radius:6px;display:flex;margin-left:auto;}
.sb-logout:hover{color:#fff;}
.bnav{display:none;background:var(--surface);border-top:1px solid var(--border);position:sticky;bottom:0;z-index:30;}
.ntab{flex:1;padding:9px 4px 7px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-family:inherit;color:var(--text3);transition:color .15s;position:relative;}
.ntab.active{color:var(--blue);font-weight:600;}
.ntab svg{width:22px;height:22px;}
.notif-badge{position:absolute;top:4px;right:calc(50% - 16px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 5px;min-width:17px;text-align:center;pointer-events:none;}
#hamburger{display:none;background:none;border:none;cursor:pointer;padding:4px;color:var(--text);}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:18px;font-weight:700;}
.page-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.dash-bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.stat{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.stat-ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-val{font-size:26px;font-weight:700;line-height:1;}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:2px;}
.tbl-wrap{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);overflow:hidden;}
.tbl-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
table{width:100%;border-collapse:collapse;}
th{background:#f8fafc;padding:9px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafbfc;}
.search-input{border:1px solid var(--border2);border-radius:var(--r2);padding:8px 12px;font-size:13px;font-family:inherit;color:var(--text);background:var(--surface);width:220px;}
.search-input:focus{outline:none;border-color:var(--blue);}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--border);}
.card-title{font-size:15px;font-weight:600;margin-bottom:2px;}
.card-sub{font-size:12px;color:var(--text2);}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.dates-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.li{background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:8px;box-shadow:var(--sh);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:box-shadow .15s;}
.li:hover{box-shadow:var(--sh2);}
.li.inactive{opacity:.55;border-style:dashed;}
.li-left{flex:1;min-width:0;}
.li-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-sub{font-size:13px;color:var(--text2);margin-top:3px;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--r3);font-size:12px;font-weight:600;white-space:nowrap;}
.b-red{background:var(--red-light);color:var(--red);}
.b-amber{background:var(--amber-light);color:var(--amber);}
.b-green{background:var(--green-light);color:var(--green);}
.b-gray{background:#f3f4f6;color:#6b7280;}
.b-blue{background:var(--blue-light);color:var(--blue);}
.b-purple{background:var(--purple-light);color:var(--purple);}
.b-inactive{background:#f3f4f6;color:#9ca3af;}
.btn{padding:9px 16px;border-radius:var(--r2);border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s,transform .1s;}
.btn:active{transform:scale(.97);}.btn:hover{opacity:.88;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-ghost{background:#f3f4f6;color:var(--text);}
.btn-red{background:var(--red);color:#fff;}
.btn-sm{padding:7px 13px;font-size:12px;}
.btn-full{width:100%;justify-content:center;padding:13px;border-radius:var(--r);margin-bottom:10px;}
.ico-btn{padding:6px;border-radius:var(--r2);border:none;background:none;cursor:pointer;display:inline-flex;align-items:center;color:var(--text3);transition:background .15s,color .15s;}
.ico-btn:hover{background:#f3f4f6;color:var(--text);}
.ico-btn.danger:hover{background:var(--red-light);color:var(--red);}
.ico-btn svg{width:16px;height:16px;}
.actions-cell{display:flex;gap:4px;align-items:center;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;letter-spacing:.02em;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border2);border-radius:var(--r2);padding:10px 12px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12);}
.field input:disabled,.field select:disabled{background:#f3f4f6;color:var(--text3);cursor:not-allowed;}
.field textarea{resize:none;height:72px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
.chip{padding:8px 15px;border-radius:var(--r3);border:1.5px solid var(--border2);cursor:pointer;font-size:13px;font-weight:600;background:var(--surface);color:var(--text2);transition:all .15s;}
.chip.active{border-color:var(--blue);background:var(--blue-light);color:var(--blue);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:600px;max-height:none;overflow-y:visible;box-shadow:0 25px 60px rgba(0,0,0,.2);margin:auto;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;position:sticky;top:0;background:var(--surface);z-index:5;border-bottom:1px solid var(--border);}
.modal-hdr h2{font-size:16px;font-weight:700;}
.modal-body{padding:20px;}
.hist{background:var(--surface2);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--blue);}
.hist.refil{border-color:var(--green);}
.hist.manutencao{border-color:var(--amber);}
.hist.ocorrencia{border-color:var(--red);}
.hist.instalacao{border-color:#7c3aed;}
.hist.corretiva{border-color:#ea580c;}
.hist.higienizacao{border-color:var(--teal);}
.hist-top{display:flex;justify-content:space-between;align-items:center;}
.hist-type{font-size:13px;font-weight:700;}
.hist-date{font-size:12px;color:var(--text3);font-family:monospace;}
.hist-desc{font-size:13px;color:var(--text2);margin-top:5px;line-height:1.5;}
.hist-tech{font-size:12px;color:var(--text3);margin-top:3px;}
.date-box{border-radius:var(--r2);padding:12px;text-align:center;}
.date-box .ico{font-size:20px;margin-bottom:4px;}
.date-box .lbl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;}
.date-box .val{font-size:13px;font-weight:700;font-family:monospace;}
.date-box .status{font-size:11px;margin-top:3px;}
.section-box{background:#f7fafc;border-radius:10px;padding:12px;margin-bottom:12px;border:1px solid var(--border);}
.section-box-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:10px;}
.photo-upload-area{border:2px dashed var(--border2);border-radius:var(--r);padding:14px;text-align:center;cursor:pointer;color:var(--text3);background:var(--surface2);font-size:13px;}
.photo-upload-area:hover{border-color:var(--blue);color:var(--blue);}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;}
.photo-thumb{position:relative;border-radius:var(--r2);overflow:hidden;aspect-ratio:1;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface2);border-radius:var(--r2);margin-bottom:12px;border:1px solid var(--border);}
.toggle-lbl{font-size:13px;font-weight:600;}
.toggle-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.toggle-sw{position:relative;width:44px;height:24px;flex-shrink:0;}
.toggle-sw input{opacity:0;width:0;height:0;}
.toggle-sw .sl{position:absolute;inset:0;background:var(--border2);border-radius:99px;cursor:pointer;transition:background .2s;}
.toggle-sw input:checked+.sl{background:var(--green);}
.toggle-sw .sl::before{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle-sw input:checked+.sl::before{transform:translateX(20px);}
.qr-wrap{display:flex;justify-content:center;padding:20px;background:var(--surface2);border-radius:var(--r);margin-bottom:14px;}
.alert-item{background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px;}
.alert-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.info-row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);margin-top:4px;}
.row{display:flex;align-items:center;justify-content:space-between;}
.row-start{display:flex;align-items:center;gap:8px;}
.empty{text-align:center;padding:48px 20px;color:var(--text3);}
.empty-ico{font-size:40px;margin-bottom:10px;}
.sec-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:16px 0 10px;display:flex;align-items:center;gap:6px;}
.report-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.rs{background:var(--surface);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--sh);border:1px solid var(--border);}
.rs-val{font-size:24px;font-weight:700;}
.rs-lbl{font-size:11px;color:var(--text2);margin-top:2px;}
.login-bg{min-height:100vh;background:linear-gradient(145deg,#1241a8,#1a56db 55%,#2563eb);display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{background:#fff;border-radius:20px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px;}
.profile-btn{padding:18px 10px;border:2px solid var(--border);border-radius:12px;cursor:pointer;text-align:center;background:#fff;transition:all .15s;width:100%;}
.profile-btn:hover{border-color:var(--blue);background:var(--blue-light);}
.profile-ico{font-size:30px;margin-bottom:6px;}
.profile-name{font-size:13px;font-weight:700;color:var(--text);}
.profile-desc{font-size:11px;color:var(--text3);margin-top:2px;}
.pin-display{display:flex;gap:10px;justify-content:center;margin:16px 0;}
.pin-dot{width:15px;height:15px;border-radius:50%;background:var(--border2);}
.pin-dot.filled{background:var(--blue);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pin-key{padding:16px;border:1px solid var(--border2);border-radius:10px;cursor:pointer;font-size:18px;font-weight:600;background:#fff;color:var(--text);text-align:center;transition:all .15s;}
.pin-key:hover{background:var(--blue-light);border-color:var(--blue);color:var(--blue);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:var(--r3);font-size:13px;font-weight:500;z-index:500;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
@media(max-width:1024px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #content{padding:14px;}
  #hamburger{display:flex;}
  .bnav{display:flex;}
  .dash-grid{grid-template-columns:1fr 1fr;}
  .dash-bottom{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:1fr;}
  .dates-grid{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:1fr 1fr;}
  .search-input{width:100%;}
  .overlay{align-items:flex-start;padding:0;padding-top:env(safe-area-inset-top,0);}
  .modal{border-radius:0;max-width:100%;min-height:100%;}
  body{font-size:15px;}
  .li-title{font-size:16px;}
  .li-sub{font-size:14px;}
  .badge{font-size:13px;padding:4px 11px;}
  .btn{font-size:15px;padding:11px 18px;}
  .btn-sm{font-size:14px;padding:9px 14px;}
  .ntab{font-size:12px;}
  .ntab svg{width:24px;height:24px;}
  .stat-val{font-size:28px;}
  .field input,.field select,.field textarea{font-size:16px;padding:12px 14px;}
  .chip{font-size:14px;padding:9px 16px;}
}
@media(min-width:1025px){.mobile-only{display:none!important;}}
@media print{#sidebar,#topbar,.bnav,.btn,.ico-btn{display:none!important;}#main{margin-left:0;}body{background:#fff;}}
</style>

<script>
var FB_KEY='aq_fb_config';
var SESS_KEY='aq_session';
var COLS={co:'companies',pu:'purifiers',ma:'maintenances',te:'technicians',at:'assistencias',ph:'photos'};
var db=null;
var storage=null;
var FB_OK=false;

var _FB_DEFAULT={
  apiKey:"AIzaSyCdRdPIM7fjV-5prMCHs_3eYqS5aARSu5I",
  authDomain:"aquapure-9100b.firebaseapp.com",
  projectId:"aquapure-9100b",
  storageBucket:"aquapure-9100b.firebasestorage.app",
  messagingSenderId:"132328899335",
  appId:"1:132328899335:web:d9e7b99354b51de0a37ba2"
};

var FB_ERR='';
var DB_ERR='';

function initFirebase(){
  var cfg=_FB_DEFAULT;
  /* localStorage pode lancar excecao (aba anonima, cookies bloqueados, WebView).
     Isso nao pode derrubar o Firebase: caimos na config padrao. */
  try{
    var saved=localStorage.getItem(FB_KEY);
    if(saved){var pc=JSON.parse(saved);if(pc&&pc.apiKey&&pc.projectId)cfg=pc;}
  }catch(e){}
  if(typeof firebase==='undefined'){
    FB_ERR='As bibliotecas do Firebase nao carregaram. Verifique sua conexao com a internet (ou bloqueio de rede/anuncios) e recarregue a pagina.';
    return false;
  }
  if(!cfg.apiKey||!cfg.projectId){FB_ERR='Configuracao do Firebase incompleta.';return false;}
  try{
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    db=firebase.firestore();
    /* cache local: nas aberturas seguintes os dados vem do proprio aparelho
       e so as mudancas sao baixadas. Falha em aba anonima - nao e critico. */
    try{db.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(e){}
  }catch(e){FB_ERR='Falha ao iniciar o Firebase: '+e.message;return false;}
  /* Storage e opcional (so para videos) - nao pode impedir o acesso aos dados. */
  try{storage=firebase.storage();}catch(e){storage=null;}
  return true;
}
FB_OK=initFirebase();

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){return new Date().toISOString().split('T')[0];}
function fmtDate(s){if(!s)return'-';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function addMon(s,n){if(!s||!n)return'';var d=new Date(s+'T12:00:00');d.setMonth(d.getMonth()+parseInt(n));return d.toISOString().split('T')[0];}
var INTERVALOS=[1,2,3,4,6,8,12];
function intervalOpts(v,def){
  var cur=parseInt(v,10);
  if(!cur||cur<1)cur=def;
  var list=INTERVALOS.slice();
  /* mantem um valor ja salvo que nao esteja na lista, para nao troca-lo sem querer */
  if(list.indexOf(cur)<0){list.push(cur);list.sort(function(a,b){return a-b;});}
  return list.map(function(n){
    return '<option value="'+n+'"'+(cur===n?' selected':'')+'>'+(n===1?'Mensal (1 mes)':n+' meses')+'</option>';

function compressImg(file,cb){
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas');
      var w=img.width,h=img.height,MAX=800;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.75));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

function addAtVideo(useCamera){
  if(_atVideos.length>=2){showToast('Máximo 2 vídeos');return;}
  if(!FB_OK||!storage){showToast('Vídeos exigem conexão com Firebase');return;}
  var inp=document.createElement('input');inp.type='file';inp.accept='video/*';
  if(useCamera)inp.capture='environment';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    if(f.size>50*1024*1024){alert('Vídeo muito grande (máx. 50MB). Grave um vídeo mais curto.');return;}
    var st=document.getElementById('at-vid-status');
    if(st)st.innerHTML='⏳ Enviando vídeo... 0%';
    var ext=(f.name.split('.').pop()||'mp4').toLowerCase();
    var path='assistencias/videos/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
    var task=storage.ref(path).put(f);
    var lastProg=Date.now();
    var watchdog=setInterval(function(){
      if(Date.now()-lastProg>45000){
        clearInterval(watchdog);try{task.cancel();}catch(e){}
        if(st)st.innerHTML='';
        alert('Upload travou. Verifique as regras do Firebase Storage (precisam permitir escrita pública) e sua conexão.');
      }
    },5000);
    task.on('state_changed',function(snap){
      lastProg=Date.now();
      var pct=Math.round(snap.bytesTransferred/snap.totalBytes*100);
      if(st)st.innerHTML='⏳ Enviando vídeo... '+pct+'%';
    },function(err){
      clearInterval(watchdog);
      if(st)st.innerHTML='';
      alert('Erro no upload do vídeo: '+err.message+'\n\nDica: as regras do Firebase Storage precisam permitir escrita.');
    },function(){
      clearInterval(watchdog);
      task.snapshot.ref.getDownloadURL().then(function(url){
        if(st)st.innerHTML='';
        _atVideos.push({url:url,name:f.name});
        renderAtMedia();showToast('Vídeo enviado!');
      }).catch(function(){if(st)st.innerHTML='';alert('Erro ao obter link do vídeo.');});
    });
  };
  inp.click();
}

function doLogin(){
  var found=null;
  if(FB_OK){
    for(var i=0;i<S.technicians.length;i++){
      var te=S.technicians[i];
      if(String(te.pin)===String(S.loginPin)&&te.profile===S.loginProfile){found=te;break;}
    }
  }
  var ok=FB_OK?!!found:true;
  if(ok){
    var teName=found?found.name:({comercial:'Comercial',tecnico:'Tecnico'}[S.loginProfile]);
    S.user={profile:S.loginProfile,name:teName};
    try{sessionStorage.setItem(SESS_KEY,JSON.stringify(S.user));}catch(e){}
    S.view='dashboard';S.loginPin='';S._waitingLogin=false;
  }else{showToast('PIN incorreto');S.loginPin='';S._waitingLogin=false;}
  render();
}
function pinKey(k){
  if(k==='←'){S.loginPin=S.loginPin.slice(0,-1);render();return;}
  if(S.loginPin.length>=4)return;
  S.loginPin+=k;
  if(S.loginPin.length===4){
    if(FB_OK&&!S.techLoaded){
      S._waitingLogin=true;
      showToast('Aguardando dados...');
      render();
      return;
    }
    doLogin();
    return;
  }
  render();
}

function goTo(v,opts){
  opts=opts||{};
  S.stack.push({view:S.view,selC:S.selC,selP:S.selP});
  S.view=v;
  if(opts.c!==undefined)S.selC=opts.c;
  if(opts.p!==undefined)S.selP=opts.p;
  render();
}
function goBack(){
  var prev=S.stack.pop();
  if(prev){S.view=prev.view;S.selC=prev.selC;S.selP=prev.selP;}
  else S.view='dashboard';
  render();
}
function setTab(t){
  S.view=t;S.stack=[];S.modal=null;S.search='';S.showInactive=false;
  S.selM=null;S.selMa=null;
  var sb=document.getElementById('sidebar');
  if(sb)sb.classList.remove('open');

function openModal(t,d){
  d=d||{};
  S.modal={t:t,d:d};
  if(t==='ma'){_photos={before:[],after:[]};S.maCid='';S.maPid='';}
  if(t==='pu'){
    var ped=d.edit;
    _purPhoto=(ped&&(ped.photo||_fotoCache[ped.id]))||'';
    /* foto na colecao separada: busca e preenche o preview quando chegar */
    if(ped&&!_purPhoto&&temFoto(ped)){
      getFoto(ped.id,function(b64){
        if(!b64)return;
        _purPhoto=b64;
        var prev=document.getElementById('pur-photo-prev');
        if(prev)prev.innerHTML='<img src="'+b64+'" style="width:100%;border-radius:8px;object-fit:contain;background:#f8fafc;margin-bottom:6px;display:block;"/>'
          +'<button class="btn btn-ghost btn-sm" onclick="removePurPhoto()">🗑 Remover foto</button>';

  }

    var ed=d.edit;
    _atPhotos=ed?((ed.fotosEntrada&&ed.fotosEntrada.slice())||(ed.fotoEntrada?[ed.fotoEntrada]:[])):[];
    _atVideos=ed&&ed.videosEntrada?ed.videosEntrada.slice():[];

}

  var fTo=document.getElementById('hf-to')?document.getElementById('hf-to').value:'';

  function perStart(){
    if(fPer==='today')return today();
    if(fPer==='week'){var d=new Date();d.setDate(d.getDate()-6);return d.toISOString().split('T')[0];}
    if(fPer==='month')return new Date(now.getFullYear(),now.getMonth(),1).toISOString().split('T')[0];
    if(fPer==='3m')return new Date(now.getFullYear(),now.getMonth()-3,1).toISOString().split('T')[0];

    +'<div class="field" style="margin-bottom:0"><label>Periodo</label><select id="hf-per" onchange="S.selM=null;render()">'
    +'<option value="all">Todo o historico</option>'

function vReports(){
  var selId=(document.getElementById('rc')||{}).value||'';
  var per=(document.getElementById('rp')||{}).value||'all';
  var dtFrom=document.getElementById('rd-from')?document.getElementById('rd-from').value:'';
  var dtTo=document.getElementById('rd-to')?document.getElementById('rd-to').value:'';
  var now=new Date();
  function perStart(){
    if(per==='today')return today();
    if(per==='week'){var d=new Date();d.setDate(d.getDate()-6);return d.toISOString().split('T')[0];}
    if(per==='month')return new Date(now.getFullYear(),now.getMonth(),1).toISOString().split('T')[0];
    if(per==='3m')return new Date(now.getFullYear(),now.getMonth()-3,1).toISOString().split('T')[0];
    if(per==='year')return new Date(now.getFullYear(),0,1).toISOString().split('T')[0];
    if(per==='custom')return dtFrom;
    return'';
  }
  var pStart=perStart();
  var pEnd=(per==='custom')?dtTo:(per==='today'?today():'');
  var mans=S.maintenances.filter(function(m){
    if(selId&&m.cid!==selId)return false;
    if(pStart&&m.date<pStart)return false;
    if(pEnd&&m.date>pEnd)return false;
    return true;
  });
  var purs=(selId?S.purifiers.filter(function(p){return p.cid===selId;}):S.purifiers).filter(function(p){return!p.inactive;});
  var venc=purs.filter(function(p){return[p.nf,p.nm,p.nhg].some(function(d){return d&&dDiff(d)<0;});}).length;
  var prox=purs.filter(function(p){return[p.nf,p.nm,p.nhg].some(function(d){return d&&dDiff(d)>=0&&dDiff(d)<=30;});}).length;

  var coOpts='<option value="">Todas as empresas</option>';
  for(var i=0;i<S.companies.length;i++)coOpts+='<option value="'+S.companies[i].id+'"'+(selId===S.companies[i].id?' selected':'')+'>'+esc(S.companies[i].name)+'</option>';

  var html='<div class="page-header"><div class="page-title">Relatorios</div><button class="btn btn-red btn-sm" onclick="exportPDF()">📄 Exportar PDF</button></div>';
  html+='<div class="card" style="margin-bottom:16px;"><div class="'+(isMobile()?'':'g3')+'">'
    +'<div class="field" style="margin-bottom:'+(isMobile()?'12px':'0')+'"><label>Empresa</label><select id="rc" onchange="render()">'+coOpts+'</select></div>'
    +'<div class="field" style="margin-bottom:'+(isMobile()?'12px':'0')+'"><label>Periodo</label><select id="rp" onchange="render()">'
    +'<option value="all">Todo o periodo</option>'
    +'<option value="today"'+(per==='today'?' selected':'')+'>Hoje</option>'
    +'<option value="week"'+(per==='week'?' selected':'')+'>Ultimos 7 dias</option>'
    +'<option value="month"'+(per==='month'?' selected':'')+'>Este mes</option>'
    +'<option value="3m"'+(per==='3m'?' selected':'')+'>Ultimos 3 meses</option>'
    +'<option value="year"'+(per==='year'?' selected':'')+'>Este ano</option>'
    +'<option value="custom"'+(per==='custom'?' selected':'')+'>Personalizado...</option>'
    +'</select></div>'
    +(per==='custom'?'<div class="field" style="margin-bottom:0"><label>Intervalo</label><div class="g2"><input type="date" id="rd-from" value="'+dtFrom+'" onchange="render()"/><input type="date" id="rd-to" value="'+dtTo+'" onchange="render()"/></div></div>':'')
    +'</div></div>';

  html+='<div class="report-stat">'
    +'<div class="rs"><div class="rs-val" style="color:var(--blue)">'+mans.length+'</div><div class="rs-lbl">Registros</div></div>'
    +'<div class="rs"><div class="rs-val" style="color:var(--red)">'+venc+'</div><div class="rs-lbl">Vencidos</div></div>'
    +'<div class="rs"><div class="rs-val" style="color:var(--amber)">'+prox+'</div><div class="rs-lbl">Prox. 30d</div></div>'
    +'</div>';

  html+='<div class="tbl-wrap" style="margin-bottom:16px;"><div class="tbl-head"><span style="font-weight:600;font-size:13px;">Status dos Purificadores</span></div>'
    +'<table><thead><tr><th>Empresa</th><th>Local</th><th>Modelo</th><th>Modelo Refil</th><th>Prox. Refil</th><th>Prox. Manut.</th><th>Higienizacao</th><th>Status</th></tr></thead><tbody>';
  for(var i=0;i<purs.length;i++){
    var p=purs[i];
    var co=S.companies.filter(function(x){return x.id===p.cid;})[0];
    var dates=[p.nf,p.nm,p.nhg].filter(Boolean);
    var dvals=dates.map(function(x){return dDiff(x);});
    var d=dvals.length?Math.min.apply(null,dvals):9999;
    var b=statusBadge(d);
    html+='<tr><td>'+(co?esc(co.name):'')+'</td><td>'+esc(p.loc||'-')+'</td><td style="font-weight:500">'+esc(p.br||'')+' '+esc(p.mo||'')+'</td>'
      +'<td style="color:var(--purple)">'+(p.rfm?esc(p.rfm):'-')+'</td>'
      +'<td style="font-size:12px">'+fmtDate(p.nf)+'</td><td style="font-size:12px">'+fmtDate(p.nm)+'</td>'
      +'<td style="font-size:12px">'+(p.nhg?fmtDate(p.nhg):'-')+'</td>'
      +'<td><span class="badge '+b.c+'">'+b.t+'</span></td></tr>';
  }
  html+='</tbody></table></div>';

  html+='<div class="tbl-wrap"><div class="tbl-head"><span style="font-weight:600;font-size:13px;">Manutencoes ('+mans.length+')</span></div>';
  if(mans.length===0){html+='<div class="empty" style="padding:24px;">Nenhum registro no periodo</div>';}
  else{
    html+='<table><thead><tr><th>Data</th><th>Tipo</th><th>Empresa</th><th>Purificador</th><th>Tecnico</th><th>Descricao</th></tr></thead><tbody>';
    for(var i=0;i<mans.length;i++){
      var m=mans[i];
      var p=S.purifiers.filter(function(x){return x.id===m.pid;})[0];
      var co=S.companies.filter(function(x){return x.id===m.cid;})[0];
      html+='<tr><td style="font-family:monospace;font-size:12px;white-space:nowrap">'+fmtDate(m.date)+'</td>'
        +'<td style="white-space:nowrap">'+(TLF[m.type]||m.type)+'</td>'
        +'<td style="font-weight:500">'+(co?esc(co.name):'-')+'</td>'
        +'<td>'+(p?esc(p.br||'')+' '+esc(p.mo||'')+(p.cn?' N'+p.cn:'')+(p.loc?' ('+esc(p.loc)+')':''):'-')+'</td>'
        +'<td>'+(m.tech||'-')+'</td>'
        +'<td style="color:var(--text2);font-size:12px">'+(m.desc||'-')+'</td></tr>';
    }
    html+='</tbody></table>';
  }
  html+='</div>';
  return html;
}

function svTe(eid){
  var name=(document.getElementById('te-name')||{}).value||'';

  var pin=(document.getElementById('te-pin')||{}).value||'';
  pin=pin.trim();
  var profile=(document.getElementById('te-profile')||{}).value||'tecnico';
  if(!name){alert('Informe o nome');return;}
  if(!pin||pin.length!==4||isNaN(parseInt(pin))){alert('PIN deve ter 4 digitos');return;}
  var dup=S.technicians.filter(function(t){return t.pin===pin&&t.id!==eid;});
  if(dup.length>0){alert('Este PIN ja esta em uso por '+dup[0].name);return;}
  var it={name:name,pin:pin,profile:profile,createdAt:new Date().toISOString()};
  if(!FB_OK||!db){
    if(eid){for(var i=0;i<S.technicians.length;i++)if(S.technicians[i].id===eid){for(var k in it)S.technicians[i][k]=it[k];break;}}

function delTe(id){

function selType(v){
  document.getElementById('mtype').value=v;
  var chips=document.querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++)chips[i].classList.toggle('active',chips[i].getAttribute('data-v')===v);
  function show(id,b){var el=document.getElementById(id);if(el)el.style.display=b?'':'none';}
  var nd=document.getElementById('ndiv');if(nd)nd.style.display=v==='ocorrencia'?'none':'';
  show('nf-f',v==='refil'||v==='instalacao');
  show('nm-f',v==='manutencao'||v==='instalacao');
  show('nmc-f',v==='corretiva');
  show('nhg-f',v==='higienizacao');
  recalcDates();
}

function recalcDates(){
  var dt=document.getElementById('mdate')?document.getElementById('mdate').value:today();
  var pid=document.getElementById('mpid')?document.getElementById('mpid').value:'';
  var p=S.purifiers.filter(function(x){return x.id===pid;})[0];
  var v=document.getElementById('mtype')?document.getElementById('mtype').value:'refil';
  function set(id,val){var el=document.getElementById(id);if(el)el.value=val;}
  if(v==='refil'||v==='instalacao')set('mnf',addMon(dt,(p&&p.fim)||4));
  if(v==='manutencao'||v==='instalacao')set('mnm',addMon(dt,(p&&p.mim)||12));
  if(v==='corretiva')set('mnmc',addMon(dt,(p&&p.nmcI)||12));
  if(v==='higienizacao')set('mnhg',addMon(dt,(p&&p.nhgI)||12));
}

function updMD(){

function delC(id){
  if(!confirm('Excluir esta empresa e todos seus purificadores e manutencoes?'))return;
  if(!FB_OK||!db){
    S.companies=S.companies.filter(function(x){return x.id!==id;});
    S.purifiers=S.purifiers.filter(function(x){return x.cid!==id;});
    S.maintenances=S.maintenances.filter(function(x){return x.cid!==id;});
    if(S.view==='cd')goBack();else render();
    showToast('Empresa excluida');return;
  }
  var batch=db.batch();
  batch.delete(db.collection(COLS.co).doc(id));
  var pids=S.purifiers.filter(function(p){return p.cid===id;}).map(function(p){return p.id;});
  for(var i=0;i<pids.length;i++){
    batch.delete(db.collection(COLS.pu).doc(pids[i]));
    batch.delete(db.collection(COLS.ph).doc(pids[i]));
    delete _fotoCache[pids[i]];
    var mids=S.maintenances.filter(function(m){return m.pid===pids[i];}).map(function(m){return m.id;});
    for(var j=0;j<mids.length;j++)batch.delete(db.collection(COLS.ma).doc(mids[j]));
  }
  batch.commit().then(function(){if(S.view==='cd')goBack();else render();showToast('Empresa excluida');}).catch(function(e){alert('Erro: '+e.message);});
}

function svP(eid,cidArg){
  var cid=document.getElementById('mcid')?document.getElementById('mcid').value:cidArg;
  if(!cid){alert('Selecione a empresa');return;}
  if(!_purPhoto&&!eid){alert('Adicione a foto do purificador');return;}
  var br=document.getElementById('mbr')?document.getElementById('mbr').value.trim():'';
  var mo=document.getElementById('mmo')?document.getElementById('mmo').value.trim():'';
  if(!br||!mo){alert('Preencha Marca e Modelo');return;}
  var lf=document.getElementById('mlf')?document.getElementById('mlf').value:today();
  var fim=parseInt(document.getElementById('mfim')?document.getElementById('mfim').value:4)||4;
  var lhg=document.getElementById('mlhg')?document.getElementById('mlhg').value:'';
  var nhgI=parseInt(document.getElementById('mnhgI')?document.getElementById('mnhgI').value:12)||12;
  var activeToggle=document.getElementById('minactive');
  var inactive=eid?(activeToggle?!activeToggle.checked:false):false;
  var existingPhoto=eid?((S.purifiers.filter(function(x){return x.id===eid;})[0]||{}).photo||_fotoCache[eid]||''):'';
  var it={cid:cid,cn:document.getElementById('mcn')?document.getElementById('mcn').value:'',sn:document.getElementById('msn')?document.getElementById('msn').value:'',br:br,mo:mo,loc:document.getElementById('mloc')?document.getElementById('mloc').value:'',rfm:document.getElementById('mrfm')?document.getElementById('mrfm').value:'',volt:document.getElementById('mvolt')?document.getElementById('mvolt').value:'',ins:document.getElementById('mins')?document.getElementById('mins').value:today(),lf:lf,fim:fim,nf:addMon(lf,fim),lhg:lhg,nhgI:nhgI,nhg:lhg?addMon(lhg,nhgI):'',notes:document.getElementById('mnotes')?document.getElementById('mnotes').value:'',inactive:inactive,photo:_purPhoto||existingPhoto};
  if(!FB_OK||!db){
    if(eid){for(var i=0;i<S.purifiers.length;i++)if(S.purifiers[i].id===eid){for(var k in it)S.purifiers[i][k]=it[k];break;}}
    else{it.id=uid();S.purifiers.push(it);}
    showToast(eid?'Purificador atualizado!':'Purificador cadastrado!');closeModal();render();return;
  }
  /* a foto vai para a colecao 'photos', fora do documento do purificador */
  var foto=it.photo; delete it.photo;
  it.hasPhoto=!!foto;
  function gravarFoto(pid){
    _fotoCache[pid]=foto;
    if(!foto)return db.collection(COLS.ph).doc(pid).delete().catch(function(){});
    return db.collection(COLS.ph).doc(pid).set({b64:foto,updatedAt:new Date().toISOString()});
  }
  if(eid){
    db.collection(COLS.pu).doc(eid).update(it)
      .then(function(){return gravarFoto(eid);})
      .then(function(){showToast('Purificador salvo!');closeModal();})
      .catch(function(e){alert('Erro: '+e.message);});
  }else{
    db.collection(COLS.pu).add(it)
      .then(function(ref){return gravarFoto(ref.id);})
      .then(function(){showToast('Purificador salvo!');closeModal();})
      .catch(function(e){alert('Erro: '+e.message);});
  }
}

function svM(pidArg){
  var pid=pidArg||document.getElementById('mpid').value;
  if(!pid){alert('Selecione o purificador');return;}
  var techSel=document.getElementById('mtech')?document.getElementById('mtech').value:'';
  var techFree=document.getElementById('mtechfree')?document.getElementById('mtechfree').value.trim():'';
  var tech=techFree||techSel;
  if(!tech){alert('Informe o tecnico');return;}
  var type=document.getElementById('mtype')?document.getElementById('mtype').value:'refil';
  var date=document.getElementById('mdate')?document.getElementById('mdate').value:today();
  var p=S.purifiers.filter(function(x){return x.id===pid;})[0];
  var m={pid:pid,cid:p?p.cid:'',type:type,date:date,tech:tech,desc:document.getElementById('mdesc')?document.getElementById('mdesc').value:'',nf:document.getElementById('mnf')?document.getElementById('mnf').value:'',nm:document.getElementById('mnm')?document.getElementById('mnm').value:'',nmc:document.getElementById('mnmc')?document.getElementById('mnmc').value:'',nhg:document.getElementById('mnhg')?document.getElementById('mnhg').value:'',photos:{before:_photos.before.slice(),after:_photos.after.slice()}};
  var up={};
  if(type!=='ocorrencia'&&p){
    if((type==='refil'||type==='instalacao')&&m.nf){up.lf=date;up.nf=m.nf;}
    if((type==='manutencao'||type==='instalacao')&&m.nm){up.lm=date;up.nm=m.nm;}
    if(type==='corretiva'&&m.nmc){up.lmc=date;up.nmc=m.nmc;}
    if(type==='higienizacao'&&m.nhg){up.lhg=date;up.nhg=m.nhg;}
  }
  if(!FB_OK||!db){
    m.id=uid();S.maintenances.unshift(m);
    var upKeys=Object.keys(up);
    if(upKeys.length){for(var i=0;i<S.purifiers.length;i++)if(S.purifiers[i].id===pid){for(var k=0;k<upKeys.length;k++)S.purifiers[i][upKeys[k]]=up[upKeys[k]];break;}}
    showToast('Manutencao registrada!');closeModal();render();return;
  }
  db.collection(COLS.ma).add(m).then(function(){
    if(p&&Object.keys(up).length)return db.collection(COLS.pu).doc(p.id).update(up);
  }).then(function(){showToast('Manutencao registrada!');closeModal();}).catch(function(e){alert('Erro: '+e.message);});
}

function delM(id){
  if(!confirm('Excluir este registro?'))return;
  if(!FB_OK||!db){S.maintenances=S.maintenances.filter(function(x){return x.id!==id;});render();showToast('Registro excluido');return;}
  db.collection(COLS.ma).doc(id).delete().then(function(){showToast('Registro excluido');}).catch(function(e){alert('Erro: '+e.message);});

function svAt(eid){
  var nome=(document.getElementById('at-nome')||{}).value||'';
  var marca=(document.getElementById('at-marca')||{}).value||'';
  var modelo=(document.getElementById('at-modelo')||{}).value||'';
  nome=nome.trim();marca=marca.trim();modelo=modelo.trim();
  if(!nome){alert('Informe o nome do cliente.');return;}
  if(!marca||!modelo){alert('Informe a marca e o modelo do aparelho.');return;}
  var existing=eid?(S.assistencias.filter(function(x){return x.id===eid;})[0]||{}):null;
  var it={
    numeroOS:(document.getElementById('at-nos')||{}).value||'',
    dataEntrada:(document.getElementById('at-data')||{}).value||today(),
    nomeCliente:nome,
    telefoneCliente:(document.getElementById('at-tel')||{}).value||'',
    marcaEquip:marca,
    modeloEquip:modelo,
    nSerieEquip:(document.getElementById('at-nserie')||{}).value||'',
    problemaRelatado:(document.getElementById('at-problema')||{}).value||'',
    observacoesEntrada:(document.getElementById('at-obs')||{}).value||'',
    condicaoEntrada:(document.getElementById('at-cond')||{}).value||'',
    vendedorResponsavel:(document.getElementById('at-vendedor')||{}).value||'',
    fotosEntrada:_atPhotos.slice(),
    fotoEntrada:_atPhotos[0]||'',
    videosEntrada:_atVideos.slice(),
    status:(existing&&existing.status)||'recebido',
    createdAt:(existing&&existing.createdAt)||new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };
  if(!FB_OK||!db){
    if(eid){var idx=S.assistencias.findIndex(function(x){return x.id===eid;});if(idx>=0)S.assistencias[idx]=Object.assign({},S.assistencias[idx],it);}
    else{it.id=uid();S.assistencias.unshift(it);}
    showToast(eid?'OS atualizada!':'OS criada!');closeModal();return;
  }
  if(eid){
    db.collection(COLS.at).doc(eid).update(it).then(function(){showToast('OS atualizada!');closeModal();}).catch(function(e){alert('Erro: '+e.message);});
  }else{
    db.collection(COLS.at).add(it).then(function(){showToast('OS criada!');closeModal();}).catch(function(e){alert('Erro: '+e.message);});
  }
}

function svAtOrc(eid){
  if(!eid){alert('OS não encontrada.');return;}
  var tech=(document.getElementById('ator-techfree')||{}).value||(document.getElementById('ator-tech')||{}).value||'';
  var mo=parseFloat((document.getElementById('at-mo')||{}).value)||0;
  var pc=parseFloat((document.getElementById('at-pc')||{}).value)||0;
  var upd={
    status:(document.getElementById('ator-status')||{}).value||'em_analise',
    tecnicoResponsavel:tech,
    diagnostico:(document.getElementById('ator-diag')||{}).value||'',
    servicosRealizar:(document.getElementById('ator-servicos')||{}).value||'',
    pecasNecessarias:(document.getElementById('ator-pecas')||{}).value||'',
    valorMaoObra:mo,
    valorPecas:pc,
    valorTotal:mo+pc,
    observacoesTecnicas:(document.getElementById('ator-obs')||{}).value||'',
    updatedAt:new Date().toISOString()
  };
  if(!FB_OK||!db){
    var idx=S.assistencias.findIndex(function(x){return x.id===eid;});
    if(idx>=0){for(var k in upd)S.assistencias[idx][k]=upd[k];}
    showToast('OS atualizada!');closeModal();return;
  }
  db.collection(COLS.at).doc(eid).update(upd).then(function(){showToast('OS atualizada!');closeModal();}).catch(function(e){alert('Erro: '+e.message);});
}

function delAt(id){
  if(!canDelete())return;
  if(!confirm('Excluir esta OS?'))return;
  if(!FB_OK||!db){S.assistencias=S.assistencias.filter(function(x){return x.id!==id;});render();showToast('OS excluída');return;}
  db.collection(COLS.at).doc(id).delete().then(function(){showToast('OS excluída');}).catch(function(e){alert('Erro: '+e.message);});
}

function atFotos(a){return (a.fotosEntrada&&a.fotosEntrada.length?a.fotosEntrada:(a.fotoEntrada?[a.fotoEntrada]:[]));}

function exportAtPDF(id){
  var a=S.assistencias.filter(function(x){return x.id===id;})[0];
  if(!a){showToast('OS não encontrada');return;}
  if(typeof window.jspdf==='undefined'){showToast('PDF indisponivel');return;}
  showToast('Gerando PDF...');
  var jsPDF=window.jspdf.jsPDF;var doc=new jsPDF();
  var PW=210,ML=14,MR=196,nowStr=new Date().toLocaleDateString('pt-BR');
  function chk(need){if(y+need>272){y=pdfNovaPagina(doc);doc.setFontSize(8.5);}}
  function line(lbl,val){
    if(!val)return;
    chk(6);
    doc.setFont('helvetica','bold');doc.text(lbl+':',ML,y);
    doc.setFont('helvetica','normal');
    var lines=doc.splitTextToSize(String(val),MR-ML-45);
    doc.text(lines,ML+45,y);
    y+=lines.length*4.5+1.5;
  }
  function section(t){
    chk(12);y+=3;
    var az=PURIFIC.azul;
    doc.setFillColor(240,247,250);doc.rect(ML,y-4.5,MR-ML,7,'F');
    doc.setFillColor(az[0],az[1],az[2]);doc.rect(ML,y-4.5,1.6,7,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(az[0],az[1],az[2]);
    doc.text(t,ML+4,y);
    doc.setTextColor(30,30,30);doc.setFontSize(8.5);y+=7;
  }
  var sb=atStatusBadge(a.status);
  var y=pdfCabecalho(doc,'ORDEM DE SERVIÇO','Assistência Técnica',[
    ['N° OS',a.numeroOS||'-'],
    ['Entrada',fmtDate(a.dataEntrada)],
    ['Status',sb.t]
  ]);
  doc.setFontSize(8.5);
  section('Recepção');
  line('Cliente',a.nomeCliente);
  line('Telefone',a.telefoneCliente);
  line('Equipamento',((a.marcaEquip||'')+' '+(a.modeloEquip||'')).trim());
  line('N° Série',a.nSerieEquip);
  line('Condição de limpeza',a.condicaoEntrada);
  line('Vendedor',a.vendedorResponsavel);
  line('Problema relatado',a.problemaRelatado);
  if(a.observacoesEntrada){
    chk(8);doc.setFont('helvetica','bold');doc.text('Observações (questionário):',ML,y);y+=5;
    doc.setFont('helvetica','normal');
    a.observacoesEntrada.split('\n').forEach(function(ln){
      if(!ln.trim())return;
      var ls=doc.splitTextToSize(ln,MR-ML-4);
      chk(ls.length*4.5+1);
      doc.text(ls,ML+2,y);y+=ls.length*4.5+1;
    });
  }
  var fotos=atFotos(a);
  if(fotos.length){
    chk(48);y+=2;
    doc.setFont('helvetica','bold');doc.text('Fotos de entrada:',ML,y);y+=3;
    for(var i=0;i<fotos.length&&i<3;i++){
      try{
        var fmt=fotos[i].indexOf('data:image/png')===0?'PNG':'JPEG';
        doc.addImage(fotos[i],fmt,ML+i*62,y,58,44);
        doc.setDrawColor(210,210,210);doc.setLineWidth(0.2);doc.rect(ML+i*62,y,58,44);
      }catch(e){}
    }
    y+=48;
  }
  if(a.videosEntrada&&a.videosEntrada.length){
    chk(8);doc.setFont('helvetica','bold');doc.text('Vídeos:',ML,y);doc.setFont('helvetica','normal');
    for(var v=0;v<a.videosEntrada.length;v++){
      chk(5);doc.setTextColor(PURIFIC.azul[0],PURIFIC.azul[1],PURIFIC.azul[2]);
      /* sem emoji: as fontes padrao do jsPDF nao suportam e imprimem lixo */
      doc.textWithLink('• '+(a.videosEntrada[v].name||'Vídeo '+(v+1)),ML+16,y,{url:a.videosEntrada[v].url});
      doc.setTextColor(30,30,30);y+=5;
    }
  }
  section('Avaliação Técnica / Orçamento');
  line('Técnico',a.tecnicoResponsavel);
  line('Diagnóstico',a.diagnostico);
  line('Serviços a realizar',a.servicosRealizar);
  line('Peças necessárias',a.pecasNecessarias);
  line('Mão de obra','R$ '+(a.valorMaoObra||0).toFixed(2));
  line('Peças','R$ '+(a.valorPecas||0).toFixed(2));
  chk(10);y+=1;
  var az=PURIFIC.azul;
  doc.setFillColor(240,247,250);doc.setDrawColor(az[0],az[1],az[2]);doc.setLineWidth(0.4);
  doc.roundedRect(ML,y-5,MR-ML,10,1.5,1.5,'FD');
  doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(az[0],az[1],az[2]);
  doc.text('VALOR TOTAL',ML+4,y+1.5);
  doc.text('R$ '+(a.valorTotal||0).toFixed(2),MR-4,y+1.5,{align:'right'});
  doc.setTextColor(30,30,30);doc.setFont('helvetica','normal');doc.setFontSize(8.5);y+=10;
  line('Observações técnicas',a.observacoesTecnicas);
  pdfAssinatura(doc,y);
  pdfRodape(doc,nowStr);
  doc.save('purific-OS-'+(a.numeroOS||a.id)+'.pdf');showToast('PDF gerado!');
}

function connectFirebase(){
  var raw=document.getElementById('fb-cfg')?document.getElementById('fb-cfg').value.trim():'';
  try{
    var match=raw.match(/\{[\s\S]*\}/);if(!match)throw new Error('Formato invalido');
    var json=match[0].replace(/([{,]\s*)([a-zA-Z_][a-zA-Z0-9_]*)\s*:/g,'$1"$2":').replace(/:\s*"([^"]+)"/g,': "$1"');
    var cfg=JSON.parse(json);
    if(!cfg.apiKey||!cfg.projectId)throw new Error('Incompleto');
    if(firebase.apps.length)firebase.apps.forEach(function(a){a.delete();});
    firebase.initializeApp(cfg);db=firebase.firestore();storage=firebase.storage();FB_OK=true;
    try{localStorage.setItem(FB_KEY,JSON.stringify(cfg));}catch(e){}
    startListeners();
    db.collection(COLS.te).limit(1).get().then(function(snap){
      if(snap.empty){
        db.collection(COLS.te).add({name:'Admin',pin:'1234',profile:'comercial',createdAt:new Date().toISOString()}).then(function(){
          showToast('Tecnico admin criado! PIN: 1234');
        }).catch(function(){});
      }
    }).catch(function(){});
    showToast('Firebase conectado!');S.loginProfile=null;render();
  }catch(e){alert('Erro: '+e.message);}
}

var unsubs=[];
var _adminChecked=false;

function dbErr(err,col){
  var code=err&&err.code||'';
  if(code==='permission-denied'){
    DB_ERR='Sem permissao para ler os dados ('+col+'). As regras do Firestore precisam liberar leitura.';
  }else if(code==='failed-precondition'){
    DB_ERR='O banco precisa de um indice para "'+col+'". Abra o console do navegador para ver o link de criacao.';
  }else{
    DB_ERR='Nao foi possivel conectar ao banco de dados ('+col+'). Verifique sua internet. Detalhe: '+(err&&err.message||code||'desconhecido');
  }
  render();
}

function startListeners(){
  DB_ERR='';
  for(var i=0;i<unsubs.length;i++)unsubs[i]();unsubs=[];
  var cols=[[COLS.co,'companies'],[COLS.pu,'purifiers'],[COLS.te,'technicians']];
  for(var i=0;i<cols.length;i++){
    (function(col,key){
      unsubs.push(db.collection(col).onSnapshot(function(snap){
        S[key]=snap.docs.map(function(d){var o={id:d.id};var data=d.data();for(var k in data)o[k]=data[k];return o;});
        if(key==='technicians'){
          S.techLoaded=true;
          if(!_adminChecked){
            _adminChecked=true;
            if(snap.empty){
              db.collection(COLS.te).add({name:'Admin',pin:'1234',profile:'comercial',createdAt:new Date().toISOString()}).then(function(){
                showToast('Acesso inicial: perfil Comercial, PIN 1234');
              }).catch(function(){});
            }
          }
          if(S._waitingLogin&&S.loginPin.length===4){doLogin();return;}
        }
        S.loaded=true;DB_ERR='';render();
      },function(err){dbErr(err,key);}));
    })(cols[i][0],cols[i][1]);
  }
  unsubs.push(db.collection(COLS.ma).orderBy('date','desc').onSnapshot(function(snap){
    S.maintenances=snap.docs.map(function(d){var o={id:d.id};var data=d.data();for(var k in data)o[k]=data[k];return o;});
    render();
  },function(err){dbErr(err,'manutencoes');}));
  unsubs.push(db.collection(COLS.at).orderBy('dataEntrada','desc').onSnapshot(function(snap){
    S.assistencias=snap.docs.map(function(d){var o={id:d.id};var data=d.data();for(var k in data)o[k]=data[k];return o;});
    render();
  },function(err){dbErr(err,'assistencias');}));
}

function retryConn(){
  DB_ERR='';FB_ERR='';
  if(!FB_OK){FB_OK=initFirebase();}
  if(FB_OK&&db){startListeners();showToast('Reconectando...');}
  else{showToast('Ainda sem conexao');}
  render();
}

var MESES_EXT=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dataExtenso(d){
  d=d||new Date();
  return d.getDate()+' de '+MESES_EXT[d.getMonth()]+' de '+d.getFullYear();
}

/* Marca d'agua: logo central, bem suave, por cima do conteudo. */
function pdfMarcaDagua(doc){
  try{
    var w=132,h=w*LOGO_RATIO;
    doc.saveGraphicsState();
    doc.setGState(new doc.GState({opacity:0.07}));
    doc.addImage(LOGO_PURIFIC,'PNG',(210-w)/2,(297-h)/2,w,h);
    doc.restoreGraphicsState();
  }catch(e){}
}

/* Nova pagina ja com marca d'agua e cabecalho reduzido. Devolve o Y inicial. */
var PDF_TOPY=27;
function pdfNovaPagina(doc){
  doc.addPage();
  try{doc.addImage(LOGO_PURIFIC,'PNG',14,9,34,34*LOGO_RATIO);}catch(e){}
  var a=PURIFIC.azul;
  doc.setDrawColor(a[0],a[1],a[2]);doc.setLineWidth(0.4);doc.line(14,21,196,21);
  doc.setTextColor(30,30,30);doc.setFont('helvetica','normal');
  return PDF_TOPY;
}

/* Cabecalho da primeira pagina. Devolve o Y livre abaixo dele. */
function pdfCabecalho(doc,titulo,subtitulo,infos){
  var ML=14,MR=196,a=PURIFIC.azul,v=PURIFIC.verde;
  try{doc.addImage(LOGO_PURIFIC,'PNG',ML,10,48,48*LOGO_RATIO);}catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(12.5);
  doc.setTextColor(a[0],a[1],a[2]);
  doc.text(titulo,MR,16,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);
  doc.setTextColor(120,120,120);
  doc.text(subtitulo,MR,21,{align:'right'});
  doc.setTextColor(130,130,130);doc.setFontSize(7);
  doc.text(PURIFIC.nome+'  ·  CNPJ '+PURIFIC.cnpj,MR,25.5,{align:'right'});
  /* filete azul com realce verde, ecoando o logo */
  doc.setDrawColor(a[0],a[1],a[2]);doc.setLineWidth(0.6);doc.line(ML,29,MR,29);
  doc.setDrawColor(v[0],v[1],v[2]);doc.setLineWidth(0.6);doc.line(ML,29,ML+38,29);
  /* faixa de identificacao */
  doc.setFillColor(240,247,250);doc.roundedRect(ML,33,MR-ML,13,1.5,1.5,'F');
  var colW=(MR-ML)/infos.length;
  for(var i=0;i<infos.length;i++){
    var x=ML+4+i*colW;
    doc.setFont('helvetica','bold');doc.setFontSize(6);doc.setTextColor(a[0],a[1],a[2]);
    doc.text(infos[i][0].toUpperCase(),x,38);
    doc.setFont('helvetica','normal');doc.setTextColor(40,40,40);
    /* reduz a fonte ate caber em 2 linhas, para nao truncar nome de cliente */
    var txt=String(infos[i][1]||'-'),fs=8,ls;
    while(true){
      doc.setFontSize(fs);
      ls=doc.splitTextToSize(txt,colW-6);
      if(ls.length<=2||fs<=5.5)break;
      fs-=0.5;
    }
    doc.text(ls.slice(0,2),x,ls.length>1?41.5:43);
  }
  doc.setTextColor(30,30,30);
  return 50;
}

/* Rodape institucional em todas as paginas. */
function pdfRodape(doc,nowStr){
  var ML=14,MR=196,PW=210,a=PURIFIC.azul;
  var pc=doc.getNumberOfPages();
  for(var i=1;i<=pc;i++){
    doc.setPage(i);
    pdfMarcaDagua(doc);
    doc.setDrawColor(a[0],a[1],a[2]);doc.setLineWidth(0.4);doc.line(ML,280,MR,280);
    doc.setFont('helvetica','bold');doc.setFontSize(7);
    doc.setTextColor(a[0],a[1],a[2]);
    doc.text(PURIFIC.nome+'  ·  CNPJ '+PURIFIC.cnpj,PW/2,284.5,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(6.5);
    doc.setTextColor(110,110,110);
    doc.text(PURIFIC.endereco+'  ·  Tel. '+PURIFIC.tel+'  ·  WhatsApp '+PURIFIC.whats,PW/2,288.5,{align:'center'});
    doc.setTextColor(165,165,165);doc.setFontSize(6);
    doc.text('Página '+i+' de '+pc+'  ·  Emitido em '+nowStr,PW/2,292.5,{align:'center'});
  }
}

function fotoDe(p){return (p&&(p.photo||_fotoCache[p.id]))||'';}

/* busca as fotos que faltam antes de montar o PDF */
function exportPDF(){
  if(typeof window.jspdf==='undefined'){showToast('PDF indisponivel');return;}
  var selId=(document.getElementById('rc')||{}).value||'';
  var purs=(selId?S.purifiers.filter(function(p){return p.cid===selId;}):S.purifiers).filter(function(p){return!p.inactive;});
  var faltam=purs.filter(function(p){return temFoto(p)&&_fotoCache[p.id]===undefined&&!p.photo;});
  if(!faltam.length){exportPDFInterno();return;}
  showToast('Carregando '+faltam.length+' foto(s)...');
  var n=0;
  faltam.forEach(function(p){
    getFoto(p.id,function(b64){
      if(_fotoCache[p.id]===undefined)_fotoCache[p.id]=b64||'';
      if(++n===faltam.length)exportPDFInterno();
    });
  });
}

function exportPDFInterno(){
  showToast('Gerando PDF...');
  var jsPDF=window.jspdf.jsPDF;var doc=new jsPDF();
  var PW=210,ML=14,MR=196,nowStr=new Date().toLocaleDateString('pt-BR');
  var selId=(document.getElementById('rc')||{}).value||'';
  var dtFrom=document.getElementById('rd-from')?document.getElementById('rd-from').value:'';
  var dtTo=document.getElementById('rd-to')?document.getElementById('rd-to').value:'';
  var company=selId?S.companies.filter(function(c){return c.id===selId;})[0]:null;
  var period=dtFrom&&dtTo?fmtDate(dtFrom)+' a '+fmtDate(dtTo):dtFrom?'A partir de '+fmtDate(dtFrom):dtTo?'Até '+fmtDate(dtTo):'Todo o período';
  var topY=pdfCabecalho(doc,'RELATÓRIO TÉCNICO','Purificadores e Manutenções',[
    ['Cliente',company?company.name:'Todas as empresas'],
    ['Período',period],
    ['Emitido em',nowStr]
  ]);
  var purs=(selId?S.purifiers.filter(function(p){return p.cid===selId;}):S.purifiers).filter(function(p){return!p.inactive;});
  purs=purs.slice().sort(function(a,b){
    var na=parseInt(a.cn,10),nb=parseInt(b.cn,10);
    var va=isNaN(na)?Infinity:na,vb=isNaN(nb)?Infinity:nb;
    if(va!==vb)return va-vb;
    return(a.cn||'').localeCompare(b.cn||'');
  });
  var venc=purs.filter(function(p){return[p.nf,p.nm,p.nhg].some(function(d){return d&&dDiff(d)<0;});}).length;
  var mans=S.maintenances.filter(function(m){
    if(selId&&m.cid!==selId)return false;
    if(dtFrom&&m.date<dtFrom)return false;
    if(dtTo&&m.date>dtTo)return false;
    return true;
  });
  doc.setFillColor(248,250,252);doc.setDrawColor(228,234,238);doc.setLineWidth(0.3);
  doc.roundedRect(ML,topY,PW-ML*2,13,1.5,1.5,'FD');
  doc.setFontSize(8.5);doc.setFont('helvetica','bold');
  doc.setTextColor(PURIFIC.azul[0],PURIFIC.azul[1],PURIFIC.azul[2]);doc.text(purs.length+' purificadores ativos',ML+6,topY+8);
  doc.setTextColor(224,36,36);doc.text(venc+' vencidos',ML+66,topY+8);
  doc.setTextColor(14,159,110);doc.text(mans.length+' registros no período',ML+110,topY+8);
  doc.setTextColor(30,30,30);doc.setFont('helvetica','normal');
  var py=topY+20;
  if(purs.length>0){
    doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text('Purificadores Cadastrados',ML,topY+21);
    py=topY+25;
    for(var i=0;i<purs.length;i++){
      var p=purs[i];var co=S.companies.filter(function(x){return x.id===p.cid;})[0];
      var hasNotes=!!(p.notes&&p.notes.trim());
      var cardH=hasNotes?38:30;
      if(py+cardH>274){py=pdfNovaPagina(doc);}
      doc.setFillColor(248,250,252);doc.roundedRect(ML,py,MR-ML,cardH,2,2,'F');
      doc.setDrawColor(220,220,220);doc.setLineWidth(0.2);doc.roundedRect(ML,py,MR-ML,cardH,2,2,'S');
      var txtX=ML+4;
      var fotoP=fotoDe(p);
      if(fotoP){
        try{
          var fmt2=fotoP.indexOf('data:image/png')===0?'PNG':'JPEG';
          var imgH=hasNotes?34:24;
          doc.addImage(fotoP,fmt2,ML+2,py+2,24,imgH);
          doc.setDrawColor(210,210,210);doc.setLineWidth(0.2);doc.rect(ML+2,py+2,24,imgH);
          txtX=ML+29;
        }catch(e){}
      }
      doc.setFontSize(8.5);doc.setFont('helvetica','bold');doc.setTextColor(20,20,20);
      doc.text(esc(p.br||'')+' '+esc(p.mo||''),txtX,py+7);
      doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(80,80,80);
      if(co)doc.text('Empresa: '+esc(co.name),txtX,py+12);
      if(p.loc)doc.text('Local: '+esc(p.loc),txtX,py+17);
      var infos=[];
      if(p.cn)infos.push('N° Aparelho: '+esc(p.cn));
      if(p.sn)infos.push('N° Série: '+esc(p.sn));
      if(p.volt)infos.push('Voltagem: '+esc(p.volt));
      if(infos.length>0)doc.text(infos.join('   |   '),txtX,py+22);
      if(hasNotes){
        doc.setFontSize(6.5);doc.setFont('helvetica','italic');doc.setTextColor(100,100,100);
        var notesMaxW=(MR-60)-txtX-4;
        var notesLines=doc.splitTextToSize('Obs: '+p.notes.trim(),notesMaxW);
        doc.text(notesLines[0]+(notesLines.length>1?'...':''),txtX,py+28);
        doc.setFont('helvetica','normal');
      }
      function st(d){return d<0?'VENCIDO':d<=15?d+'d URGENTE':d<=30?d+'d':'OK';}
      var statusX=MR-60;
      doc.setFontSize(6.5);doc.setFont('helvetica','bold');
      var rC=p.nf?(dDiff(p.nf)<0?[224,36,36]:dDiff(p.nf)<=15?[194,120,3]:[14,159,110]):[150,150,150];
      doc.setTextColor(rC[0],rC[1],rC[2]);doc.text('Próx. Refil: '+(p.nf?fmtDate(p.nf)+' ('+st(dDiff(p.nf))+')':'-'),statusX,py+13);
      var hC=p.nhg?(dDiff(p.nhg)<0?[224,36,36]:dDiff(p.nhg)<=15?[194,120,3]:[14,159,110]):[150,150,150];
      doc.setTextColor(hC[0],hC[1],hC[2]);doc.text('Próx. Higienização: '+(p.nhg?fmtDate(p.nhg)+' ('+st(dDiff(p.nhg))+')':'-'),statusX,py+20);
      doc.setTextColor(30,30,30);
      py+=cardH+3;
    }
  }
  if(mans.length>0){
    var y=typeof py!=='undefined'?py+4:60;
    doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(30,30,30);
    doc.text('Manutenções ('+mans.length+')',ML,y);y+=6;
    var TLC={refil:[14,159,110],manutencao:[194,120,3],ocorrencia:[224,36,36],instalacao:[124,58,237],corretiva:[234,88,12],higienizacao:[6,148,162]};
    var TLL={refil:'REFIL',manutencao:'MANUTENÇÃO',ocorrencia:'OCORRÊNCIA',instalacao:'INSTALAÇÃO',corretiva:'CORRETIVA',higienizacao:'HIGIENIZAÇÃO'};
    for(var i=0;i<mans.length;i++){
      var m=mans[i];
      var p2=S.purifiers.filter(function(x){return x.id===m.pid;})[0];
      var c2=S.companies.filter(function(x){return x.id===m.cid;})[0];
      var ph=m.photos||{before:[],after:[]};
      var hasPh=(ph.before||[]).length>0||(ph.after||[]).length>0;
      var estH=hasPh?75:22;
      if(y+estH>272){y=pdfNovaPagina(doc);}
      var col=TLC[m.type]||[26,86,219];
      doc.setFillColor(col[0],col[1],col[2]);doc.rect(ML,y,2,hasPh?estH:18,'F');
      doc.setFillColor(col[0],col[1],col[2]);doc.setTextColor(255,255,255);doc.setFontSize(7);doc.setFont('helvetica','bold');
      doc.roundedRect(ML+4,y+1,24,5,1,1,'F');
      doc.text(TLL[m.type]||m.type.toUpperCase(),ML+16,y+4.5,{align:'center'});
      doc.setTextColor(100,100,100);doc.setFontSize(7);doc.setFont('helvetica','normal');
      doc.text(fmtDate(m.date),ML+32,y+4.5);
      if(m.tech)doc.text(m.tech,ML+65,y+4.5);
      doc.setTextColor(30,30,30);doc.setFontSize(8);doc.setFont('helvetica','bold');
      doc.text(p2?esc(p2.br||'')+' '+esc(p2.mo||'')+(p2.loc?' - '+p2.loc:''):m.pid,ML+4,y+10);
      if(c2){doc.setTextColor(26,86,219);doc.setFontSize(7);doc.setFont('helvetica','normal');doc.text(c2.name,ML+4,y+14.5);}
      if(m.desc){doc.setTextColor(60,60,60);doc.setFontSize(7);doc.text(doc.splitTextToSize(m.desc,PW-ML*2-10),ML+4,y+19);}
      y+=m.desc?23:19;
      if(hasPh){
        function addPh(arr,lbl){
          if(!arr||!arr.length)return;
          doc.setFontSize(7);doc.setFont('helvetica','bold');doc.setTextColor(80,80,80);
          doc.text(lbl,ML+4,y);y+=3;
          var SZ=35,GAP=4,px=ML+4;
          for(var j=0;j<arr.length;j++){
            try{
              if(y+SZ+4>274){y=pdfNovaPagina(doc);px=ML+4;}
              var fmt=arr[j].indexOf('data:image/png')===0?'PNG':'JPEG';
              doc.addImage(arr[j],fmt,px,y,SZ,SZ);
              doc.setDrawColor(200,200,200);doc.setLineWidth(0.2);doc.rect(px,y,SZ,SZ);
              px+=SZ+GAP;
            }catch(e){}
          }
          y+=SZ+5;
        }
        if(y+5>272){y=pdfNovaPagina(doc);}
        addPh(ph.before,'ANTES:');addPh(ph.after,'DEPOIS:');
      }
      doc.setDrawColor(220,220,220);doc.setLineWidth(0.2);doc.line(ML,y,MR,y);y+=4;
    }
  }
  var fimY=typeof y!=='undefined'?y:py;
  pdfAssinatura(doc,fimY);
  pdfRodape(doc,nowStr);
  doc.save('purific-relatorio-'+today()+'.pdf');showToast('PDF gerado!');
}

function connBanner(){
  var msg='',titulo='';
  if(!FB_OK){
    titulo='⚠️ Modo demonstracao — seus dados NAO estao sendo exibidos';
    msg=FB_ERR||'O app nao conseguiu conectar ao banco de dados. As empresas mostradas abaixo sao apenas exemplos.';
  }else if(DB_ERR){
    titulo='⚠️ Falha ao carregar os dados';
    msg=DB_ERR;
  }else{
    return '';
  }
  return '<div style="background:var(--amber-light);border:1px solid var(--amber);border-radius:var(--r2);padding:12px 14px;margin-bottom:14px;">'
    +'<div style="font-weight:700;font-size:13px;color:var(--amber);margin-bottom:4px;">'+titulo+'</div>'
    +'<div style="font-size:12px;color:var(--text2);line-height:1.5;">'+esc(msg)+'</div>'
    +'<button class="btn btn-ghost btn-sm" onclick="retryConn()" style="margin-top:8px;">🔄 Tentar reconectar</button>'
    +'</div>';
}

function render(){
  var root=document.getElementById('root');if(!root)return;
  if(!S.user||S.view==='login'){root.innerHTML=vLogin();return;}
  var ae=document.activeElement;
  if(S.modal&&ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&ae.closest&&ae.closest('.modal')){return;}

  var activeTab=({cd:'companies',pd:'purifiers'}[S.view])||S.view;
  var canBack=S.view==='cd'||S.view==='pd';
  var pageTitles={dashboard:'Dashboard',companies:'Empresas',cd:S.selC?S.selC.name:'Empresa',purifiers:'Purificadores',pd:(function(){var p=S.selP;return p?((p.br||'')+' '+(p.mo||'')).trim()||'Purificador':'Purificador';})(),maintenance:'Manutencao',history:'Historico',reports:'Relatorios',technicians:'Tecnicos',assistencia:'Assistência Técnica'};

  var content='';
  if(S.view==='dashboard')content=vDashboard();
  else if(S.view==='companies')content=vCompanies();
  else if(S.view==='cd')content=vCD();
  else if(S.view==='purifiers')content=vPurifiers();
  else if(S.view==='pd')content=vPD();
  else if(S.view==='maintenance')content=vMaintenance();
  else if(S.view==='history')content=vHistory();
  else if(S.view==='reports')content=vReports();
  else if(S.view==='technicians')content=vTechnicians();
  else if(S.view==='assistencia')content=vAssistencia();

  var alerts=allAlerts();
  var urgentes=alerts.filter(function(a){return a.d<=15;}).length;

  var modal='';
  if(S.modal){
    var t=S.modal.t;var d=S.modal.d;
    var titles={co:d.edit?'Editar empresa':'Nova empresa',pu:d.edit?'Editar purificador':'Novo purificador',ma:'Registrar manutencao',qr:'QR Code',te:d.edit?'Editar tecnico':'Novo tecnico',at:d.edit?'Editar OS — Recepção':'Nova OS — Recepção',ator:'Atualizar OS — Técnico'};
    var mb='';
    if(t==='co')mb=mCo(d.edit||null);
    else if(t==='pu')mb=mPu(d.edit||null,d.cid||null);
    else if(t==='ma')mb=mMa(d.pid||null);
    else if(t==='qr')mb=mQR(d.pid||null);
    else if(t==='te')mb=mTe(d.edit||null);
    else if(t==='at')mb=mAt(d.edit||null);
    else if(t==='ator')mb=mAtOrc(d.edit||null);
    modal='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-hdr"><h2>'+(titles[t]||'')+'</h2><button class="ico-btn" onclick="closeModal()">'+IC.x+'</button></div><div class="modal-body">'+mb+'</div></div></div>';
  }

  var sbItems='';
  for(var i=0;i<TABS.length;i++){
    var tab=TABS[i];
    if(tab==='technicians'&&!isComercial())continue;
    sbItems+='<div class="sb-item'+(activeTab===tab?' active':'')+'" onclick="setTab(\''+tab+'\')">'
      +TAB_ICONS[tab]+'<span>'+TAB_NAMES[tab]+'</span>'
      +(tab==='maintenance'&&urgentes>0?'<span class="sb-badge">'+urgentes+'</span>':'')
      +'</div>';
  }

  var bnav='';
  for(var i=0;i<TABS.length;i++){
    var tab=TABS[i];
    if(tab==='technicians'&&!isComercial())continue;
    bnav+='<button class="ntab'+(activeTab===tab?' active':'')+'" onclick="setTab(\''+tab+'\')">'
      +TAB_ICONS[tab]
      +(tab==='maintenance'&&urgentes>0?'<span class="notif-badge">'+urgentes+'</span>':'')
      +'<span>'+TAB_NAMES[tab]+'</span></button>';
  }

  root.innerHTML='<div id="app">'
    +'<nav id="sidebar">'
    +'<div class="sb-logo"><span>💧</span><h2>AquaPure</h2></div>'
    +'<div class="sb-nav">'+sbItems+'</div>'
    +'<div class="sb-footer"><div class="sb-user">'
    +'<div class="sb-user-ico">'+(S.user.profile==='tecnico'?'🔧':'💼')+'</div>'
    +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">'+(S.user.name||'')+'</span>'
    +'<button class="sb-logout" onclick="logout()" title="Sair">'+IC.logout+'</button>'
    +'</div></div></nav>'
    +'<div id="main">'
    +'<div id="topbar">'
    +'<button id="hamburger" onclick="toggleSidebar()">'+IC.menu+'</button>'
    +(canBack?'<button class="ico-btn" onclick="goBack()" style="color:var(--blue)">'+IC.back+'</button>':'')
    +'<h1>'+(pageTitles[S.view]||'AquaPure')+'</h1>'
    +'<span style="font-size:11px;margin-left:auto;margin-right:8px;color:'+(FB_OK?'var(--green)':'var(--amber)')+';">'+(FB_OK?'🟢 Online':'🟡 Demo')+'</span>'
    +'<button class="btn btn-ghost btn-sm" onclick="logout()" style="display:flex;align-items:center;gap:5px;">'+IC.logout+' Sair</button>'
    +'</div>'
    +'<div id="content">'+connBanner()+content+'</div>'
    +'<div class="bnav">'+bnav+'</div>'
    +'</div></div>'+modal;

  var hash=window.location.hash;
  if(hash.indexOf('#p=')===0){
    var pid=hash.slice(3);
    var found=S.purifiers.filter(function(x){return x.id===pid;})[0];
    if(found&&(!S.selP||S.selP.id!==pid)){S.selP=found;S.view='pd';window.location.hash='';render();}
  }
}

window.addEventListener('hashchange',function(){
  var h=window.location.hash;
  if(h.indexOf('#p=')===0){
    var pid=h.slice(3);
    var p=S.purifiers.filter(function(x){return x.id===pid;})[0];
    if(p){S.selP=p;S.view='pd';window.location.hash='';render();}
  }
});
window.addEventListener('resize',render);
if(FB_OK&&db)startListeners();
render();
</script>
