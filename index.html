<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#1a56db"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="AquaPure"/>
<title>AquaPure</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#f0f4f8;--surface:#fff;--surface2:#f7fafc;
  --blue:#1a56db;--blue-light:#ebf3ff;--blue-dark:#1241a8;
  --green:#0e9f6e;--green-light:#e6f6f0;
  --red:#e02424;--red-light:#fde8e8;
  --amber:#c27803;--amber-light:#fdf6b2;
  --purple:#7c3aed;--purple-light:#f0ebff;
  --teal:#0694a2;--teal-light:#e6f6f7;
  --text:#111827;--text2:#4b5563;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --r:12px;--r2:8px;--r3:20px;
  --sh:0 1px 3px rgba(0,0,0,.08);--sh2:0 4px 16px rgba(0,0,0,.12);
  --sidebar:220px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
#app{display:flex;min-height:100vh;}
#sidebar{width:var(--sidebar);background:linear-gradient(175deg,#1241a8,#1a56db 60%,#2563eb);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:40;transition:transform .25s;}
#main{margin-left:var(--sidebar);display:flex;flex-direction:column;min-height:100vh;flex:1;min-width:0;}
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;}
#topbar h1{font-size:15px;font-weight:600;flex:1;color:var(--text);}
#content{padding:20px;flex:1;}
.sb-logo{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.12);}
.sb-logo span{font-size:1.4rem;}.sb-logo h2{color:#fff;font-size:15px;font-weight:700;}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto;}
.sb-item{display:flex;align-items:center;gap:10px;padding:12px 16px;color:rgba(255,255,255,.7);cursor:pointer;transition:all .15s;border-left:3px solid transparent;font-size:13px;font-weight:500;user-select:none;}
.sb-item:hover{background:rgba(255,255,255,.1);color:#fff;}
.sb-item.active{background:rgba(255,255,255,.18);color:#fff;border-left-color:#fff;font-weight:700;}
.sb-item svg{width:18px;height:18px;flex-shrink:0;}
.sb-badge{background:var(--red);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:2px 6px;margin-left:auto;}
.sb-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);}
.sb-user{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.8);font-size:12px;}
.sb-user-ico{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.sb-logout{background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;padding:4px;border-radius:6px;display:flex;margin-left:auto;}
.sb-logout:hover{color:#fff;}
.bnav{display:none;background:var(--surface);border-top:1px solid var(--border);position:sticky;bottom:0;z-index:30;}
.ntab{flex:1;padding:9px 4px 7px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-family:inherit;color:var(--text3);transition:color .15s;position:relative;}
.ntab.active{color:var(--blue);font-weight:600;}
.ntab svg{width:22px;height:22px;}
.notif-badge{position:absolute;top:4px;right:calc(50% - 16px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 5px;min-width:17px;text-align:center;pointer-events:none;}
#hamburger{display:none;background:none;border:none;cursor:pointer;padding:4px;color:var(--text);}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:18px;font-weight:700;}
.page-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.dash-bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.stat{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.stat-ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-val{font-size:26px;font-weight:700;line-height:1;}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:2px;}
.tbl-wrap{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);overflow:hidden;}
.tbl-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
table{width:100%;border-collapse:collapse;}
th{background:#f8fafc;padding:9px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafbfc;}
.search-input{border:1px solid var(--border2);border-radius:var(--r2);padding:8px 12px;font-size:13px;font-family:inherit;color:var(--text);background:var(--surface);width:220px;}
.search-input:focus{outline:none;border-color:var(--blue);}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--border);}
.card-title{font-size:15px;font-weight:600;margin-bottom:2px;}
.card-sub{font-size:12px;color:var(--text2);}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.dates-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.li{background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:8px;box-shadow:var(--sh);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:box-shadow .15s;}
.li:hover{box-shadow:var(--sh2);}
.li.inactive{opacity:.55;border-style:dashed;}
.li-left{flex:1;min-width:0;}
.li-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-sub{font-size:13px;color:var(--text2);margin-top:3px;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--r3);font-size:12px;font-weight:600;white-space:nowrap;}
.b-red{background:var(--red-light);color:var(--red);}
.b-amber{background:var(--amber-light);color:var(--amber);}
.b-green{background:var(--green-light);color:var(--green);}
.b-gray{background:#f3f4f6;color:#6b7280;}
.b-blue{background:var(--blue-light);color:var(--blue);}
.b-purple{background:var(--purple-light);color:var(--purple);}
.b-inactive{background:#f3f4f6;color:#9ca3af;}
.btn{padding:9px 16px;border-radius:var(--r2);border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s,transform .1s;}
.btn:active{transform:scale(.97);}.btn:hover{opacity:.88;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-ghost{background:#f3f4f6;color:var(--text);}
.btn-red{background:var(--red);color:#fff;}
.btn-sm{padding:7px 13px;font-size:12px;}
.btn-full{width:100%;justify-content:center;padding:13px;border-radius:var(--r);margin-bottom:10px;}
.ico-btn{padding:6px;border-radius:var(--r2);border:none;background:none;cursor:pointer;display:inline-flex;align-items:center;color:var(--text3);transition:background .15s,color .15s;}
.ico-btn:hover{background:#f3f4f6;color:var(--text);}
.ico-btn.danger:hover{background:var(--red-light);color:var(--red);}
.ico-btn svg{width:16px;height:16px;}
.actions-cell{display:flex;gap:4px;align-items:center;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;letter-spacing:.02em;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border2);border-radius:var(--r2);padding:10px 12px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12);}
.field input:disabled,.field select:disabled{background:#f3f4f6;color:var(--text3);cursor:not-allowed;}
.field textarea{resize:none;height:72px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
.chip{padding:8px 15px;border-radius:var(--r3);border:1.5px solid var(--border2);cursor:pointer;font-size:13px;font-weight:600;background:var(--surface);color:var(--text2);transition:all .15s;}
.chip.active{border-color:var(--blue);background:var(--blue-light);color:var(--blue);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.2);}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;position:sticky;top:0;background:var(--surface);z-index:5;border-bottom:1px solid var(--border);}
.modal-hdr h2{font-size:16px;font-weight:700;}
.modal-body{padding:20px;}
.hist{background:var(--surface2);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--blue);}
.hist.refil{border-color:var(--green);}
.hist.manutencao{border-color:var(--amber);}
.hist.ocorrencia{border-color:var(--red);}
.hist.instalacao{border-color:#7c3aed;}
.hist.corretiva{border-color:#ea580c;}
.hist.higienizacao{border-color:var(--teal);}
.hist-top{display:flex;justify-content:space-between;align-items:center;}
.hist-type{font-size:13px;font-weight:700;}
.hist-date{font-size:12px;color:var(--text3);font-family:monospace;}
.hist-desc{font-size:13px;color:var(--text2);margin-top:5px;line-height:1.5;}
.hist-tech{font-size:12px;color:var(--text3);margin-top:3px;}
.date-box{border-radius:var(--r2);padding:12px;text-align:center;}
.date-box .ico{font-size:20px;margin-bottom:4px;}
.date-box .lbl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;}
.date-box .val{font-size:13px;font-weight:700;font-family:monospace;}
.date-box .status{font-size:11px;margin-top:3px;}
.section-box{background:#f7fafc;border-radius:10px;padding:12px;margin-bottom:12px;border:1px solid var(--border);}
.section-box-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:10px;}
.photo-upload-area{border:2px dashed var(--border2);border-radius:var(--r);padding:14px;text-align:center;cursor:pointer;color:var(--text3);background:var(--surface2);font-size:13px;}
.photo-upload-area:hover{border-color:var(--blue);color:var(--blue);}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;}
.photo-thumb{position:relative;border-radius:var(--r2);overflow:hidden;aspect-ratio:1;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface2);border-radius:var(--r2);margin-bottom:12px;border:1px solid var(--border);}
.toggle-lbl{font-size:13px;font-weight:600;}
.toggle-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.toggle-sw{position:relative;width:44px;height:24px;flex-shrink:0;}
.toggle-sw input{opacity:0;width:0;height:0;}
.toggle-sw .sl{position:absolute;inset:0;background:var(--border2);border-radius:99px;cursor:pointer;transition:background .2s;}
.toggle-sw input:checked+.sl{background:var(--green);}
.toggle-sw .sl::before{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle-sw input:checked+.sl::before{transform:translateX(20px);}
.qr-wrap{display:flex;justify-content:center;padding:20px;background:var(--surface2);border-radius:var(--r);margin-bottom:14px;}
.alert-item{background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px;}
.alert-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.info-row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);margin-top:4px;}
.row{display:flex;align-items:center;justify-content:space-between;}
.row-start{display:flex;align-items:center;gap:8px;}
.empty{text-align:center;padding:48px 20px;color:var(--text3);}
.empty-ico{font-size:40px;margin-bottom:10px;}
.sec-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:16px 0 10px;display:flex;align-items:center;gap:6px;}
.report-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.rs{background:var(--surface);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--sh);border:1px solid var(--border);}
.rs-val{font-size:24px;font-weight:700;}
.rs-lbl{font-size:11px;color:var(--text2);margin-top:2px;}
.login-bg{min-height:100vh;background:linear-gradient(145deg,#1241a8,#1a56db 55%,#2563eb);display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{background:#fff;border-radius:20px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px;}
.profile-btn{padding:18px 10px;border:2px solid var(--border);border-radius:12px;cursor:pointer;text-align:center;background:#fff;transition:all .15s;width:100%;}
.profile-btn:hover{border-color:var(--blue);background:var(--blue-light);}
.profile-ico{font-size:30px;margin-bottom:6px;}
.profile-name{font-size:13px;font-weight:700;color:var(--text);}
.profile-desc{font-size:11px;color:var(--text3);margin-top:2px;}
.pin-display{display:flex;gap:10px;justify-content:center;margin:16px 0;}
.pin-dot{width:15px;height:15px;border-radius:50%;background:var(--border2);}
.pin-dot.filled{background:var(--blue);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pin-key{padding:16px;border:1px solid var(--border2);border-radius:10px;cursor:pointer;font-size:18px;font-weight:600;background:#fff;color:var(--text);text-align:center;transition:all .15s;}
.pin-key:hover{background:var(--blue-light);border-color:var(--blue);color:var(--blue);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:var(--r3);font-size:13px;font-weight:500;z-index:500;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
@media(max-width:1024px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #content{padding:14px;}
  #hamburger{display:flex;}
  .bnav{display:flex;}
  .dash-grid{grid-template-columns:1fr 1fr;}
  .dash-bottom{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:1fr;}
  .dates-grid{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:1fr 1fr;}
  .search-input{width:100%;}
  .overlay{align-items:flex-end;padding:0;}
  .modal{border-radius:20px 20px 0 0;max-width:100%;}
  body{font-size:15px;}
  .li-title{font-size:16px;}
  .li-sub{font-size:14px;}
  .badge{font-size:13px;padding:4px 11px;}
  .btn{font-size:15px;padding:11px 18px;}
  .btn-sm{font-size:14px;padding:9px 14px;}
  .ntab{font-size:12px;}
  .ntab svg{width:24px;height:24px;}
  .stat-val{font-size:28px;}
  .field input,.field select,.field textarea{font-size:16px;padding:12px 14px;}
  .chip{font-size:14px;padding:9px 16px;}
}
@media(min-width:1025px){.mobile-only{display:none!important;}}
@media print{#sidebar,#topbar,.bnav,.btn,.ico-btn{display:none!important;}#main{margin-left:0;}body{background:#fff;}}
</style>

<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
var FB_KEY='aq_fb_config';
var SESS_KEY='aq_session';
var COLS={co:'companies',pu:'purifiers',ma:'maintenances',te:'technicians'};
var db=null;
var storage=null;
var FB_OK=false;

var _FB_DEFAULT={
  apiKey:"AIzaSyCdRdPIM7fjV-5prMCHs_3eYqS5aARSu5I",
  authDomain:"aquapure-9100b.firebaseapp.com",
  projectId:"aquapure-9100b",
  storageBucket:"aquapure-9100b.firebasestorage.app",
  messagingSenderId:"132328899335",
  appId:"1:132328899335:web:d9e7b99354b51de0a37ba2"
};

function initFirebase(){
  try{
    var saved=localStorage.getItem(FB_KEY);
    var cfg=saved?JSON.parse(saved):_FB_DEFAULT;
    if(!cfg.apiKey||!cfg.projectId)return false;
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    db=firebase.firestore();
    storage=firebase.storage();
    return true;
  }catch(e){return false;}
}
FB_OK=initFirebase();

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){return new Date().toISOString().split('T')[0];}
function fmtDate(s){if(!s)return'-';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function addMon(s,n){if(!s||!n)return'';var d=new Date(s+'T12:00:00');d.setMonth(d.getMonth()+parseInt(n));return d.toISOString().split('T')[0];}
function dDiff(s){if(!s)return 9999;var d=new Date(s+'T12:00:00');var n=new Date();n.setHours(12,0,0,0);return Math.ceil((d-n)/86400000);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isMobile(){return window.innerWidth<=1024;}
function isComercial(){return S.user&&S.user.profile==='comercial';}
function canDelete(){return isComercial();}
function rDate(m){var d=new Date();d.setMonth(d.getMonth()+m);return d.toISOString().split('T')[0];}

function showToast(msg){
  var t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}

function statusBadge(d){
  if(d<0)return{t:'Vencido '+Math.abs(d)+'d',c:'b-red'};
  if(d===0)return{t:'Hoje!',c:'b-red'};
  if(d<=15)return{t:d+'d urgente',c:'b-red'};
  if(d<=30)return{t:d+'d',c:'b-amber'};
  return{t:'OK',c:'b-green'};
}

function dBox(d,lbl,ico,date){
  var s=d<=15?'background:var(--red-light);color:var(--red)':d<=30?'background:var(--amber-light);color:var(--amber)':'background:var(--green-light);color:var(--green)';
  var txt=d<0?'Venc.'+Math.abs(d)+'d':d===0?'Hoje!':d===9999?'-':d+'d';

function compressImg(file,cb){
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas');
      var w=img.width,h=img.height,MAX=800;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.75));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

function addPhoto(t,useCamera){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  if(useCamera)inp.capture='environment';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    if(_photos[t].length>=3){showToast('Maximo 3 fotos');return;}
    var phEl=document.getElementById('ph-'+t);
    if(phEl){var sp=document.createElement('div');sp.id='ph-spinner-'+t;sp.style.cssText='padding:8px;text-align:center;font-size:12px;color:var(--text3);';sp.textContent='⏳ Enviando...';phEl.appendChild(sp);}
    compressImg(f,function(b64){
      uploadPhoto('manutencoes/'+t,b64,function(url){
        var sp=document.getElementById('ph-spinner-'+t);if(sp)sp.remove();
        _photos[t].push(url);renderPhotoPreview();
      },function(){
        var sp=document.getElementById('ph-spinner-'+t);if(sp)sp.remove();
        showToast('Erro ao processar foto');
      });
    });
  };
  inp.click();
}

function removePhoto(t,i){_photos[t].splice(i,1);renderPhotoPreview();}

function renderPhotoPreview(){
  ['before','after'].forEach(function(t){
    var el=document.getElementById('ph-'+t);
    if(!el)return;
    var html='';
    for(var i=0;i<_photos[t].length;i++){
      html+='<div class="photo-thumb"><img src="'+_photos[t][i]+'"/><button class="photo-del" onclick="removePhoto(\''+t+'\','+i+')">x</button></div>';
    }
    el.innerHTML=html;
  });
}

function renderQR(pid){

  },80);
}

function svTe(eid){
  var name=(document.getElementById('te-name')||{}).value||'';
  name=name.trim();
  var pin=(document.getElementById('te-pin')||{}).value||'';
  pin=pin.trim();
  var profile=(document.getElementById('te-profile')||{}).value||'tecnico';
  if(!name){alert('Informe o nome');return;}
  if(!pin||pin.length!==4||isNaN(parseInt(pin))){alert('PIN deve ter 4 digitos');return;}
  var dup=S.technicians.filter(function(t){return t.pin===pin&&t.id!==eid;});
  if(dup.length>0){alert('Este PIN ja esta em uso por '+dup[0].name);return;}
  var it={name:name,pin:pin,profile:profile,createdAt:new Date().toISOString()};
  if(!FB_OK||!db){
    if(eid){for(var i=0;i<S.technicians.length;i++)if(S.technicians[i].id===eid){for(var k in it)S.technicians[i][k]=it[k];break;}}
    else{it.id=uid();S.technicians.push(it);}
    showToast('Tecnico salvo!');closeModal();render();return;
  }
  if(eid)db.collection(COLS.te).doc(eid).update(it).then(function(){showToast('Tecnico salvo!');closeModal();}).catch(function(e){alert('Erro: '+e.message);});
  else db.collection(COLS.te).add(it).then(function(){showToast('Tecnico salvo!');closeModal();}).catch(function(e){alert('Erro: '+e.message);});
}

function delTe(id){
  if(!confirm('Excluir este tecnico?'))return;
  if(!FB_OK||!db){
    S.technicians=S.technicians.filter(function(x){return x.id!==id;});
    render();showToast('Tecnico excluido');return;
  }
  db.collection(COLS.te).doc(id).delete().then(function(){showToast('Tecnico excluido');}).catch(function(e){alert('Erro: '+e.message);});
}

function connectFirebase(){
  var raw=document.getElementById('fb-cfg')?document.getElementById('fb-cfg').value.trim():'';
  try{
    var match=raw.match(/\{[\s\S]*\}/);if(!match)throw new Error('Formato invalido');
    var json=match[0].replace(/([{,]\s*)([a-zA-Z_][a-zA-Z0-9_]*)\s*:/g,'$1"$2":').replace(/:\s*"([^"]+)"/g,': "$1"');
    var cfg=JSON.parse(json);
    if(!cfg.apiKey||!cfg.projectId)throw new Error('Incompleto');
    if(firebase.apps.length)firebase.apps.forEach(function(a){a.delete();});
    firebase.initializeApp(cfg);db=firebase.firestore();storage=firebase.storage();FB_OK=true;
    try{localStorage.setItem(FB_KEY,JSON.stringify(cfg));}catch(e){}
    startListeners();
    db.collection(COLS.te).limit(1).get().then(function(snap){
      if(snap.empty){
        db.collection(COLS.te).add({name:'Admin',pin:'1234',profile:'comercial',createdAt:new Date().toISOString()}).then(function(){
          showToast('Tecnico admin criado! PIN: 1234');
        }).catch(function(){});
      }
    }).catch(function(){});
    showToast('Firebase conectado!');S.loginProfile=null;render();
  }catch(e){alert('Erro: '+e.message);}
}

    if(tab==='technicians'&&!isComercial())continue;
    sbItems+='<div class="sb-item'+(activeTab===tab?' active':'')+'" onclick="setTab(\''+tab+'\')">'
      +TAB_ICONS[tab]+'<span>'+TAB_NAMES[tab]+'</span>'
      +(tab==='maintenance'&&urgentes>0?'<span class="sb-badge">'+urgentes+'</span>':'')
      +'</div>';
  }

  var bnav='';
  for(var i=0;i<TABS.length;i++){
    var tab=TABS[i];
    if(tab==='technicians'&&!isComercial())continue;
    bnav+='<button class="ntab'+(activeTab===tab?' active':'')+'" onclick="setTab(\''+tab+'\')">'
      +TAB_ICONS[tab]
      +(tab==='maintenance'&&urgentes>0?'<span class="notif-badge">'+urgentes+'</span>':'')
      +'<span>'+TAB_NAMES[tab]+'</span></button>';
  }

  root.innerHTML='<div id="app">'
    +'<nav id="sidebar">'
    +'<div class="sb-logo"><span>💧</span><h2>AquaPure</h2></div>'
    +'<div class="sb-nav">'+sbItems+'</div>'
    +'<div class="sb-footer"><div class="sb-user">'
    +'<div class="sb-user-ico">'+(S.user.profile==='tecnico'?'🔧':'💼')+'</div>'
    +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">'+(S.user.name||'')+'</span>'
    +'<button class="sb-logout" onclick="logout()" title="Sair">'+IC.logout+'</button>'
    +'</div></div></nav>'
    +'<div id="main">'
    +'<div id="topbar">'
    +'<button id="hamburger" onclick="toggleSidebar()">'+IC.menu+'</button>'
    +(canBack?'<button class="ico-btn" onclick="goBack()" style="color:var(--blue)">'+IC.back+'</button>':'')
    +'<h1>'+(pageTitles[S.view]||'AquaPure')+'</h1>'
    +'<span style="font-size:11px;margin-left:auto;margin-right:8px;color:'+(FB_OK?'var(--green)':'var(--amber)')+';">'+(FB_OK?'🟢 Online':'🟡 Demo')+'</span>'
    +'<button class="btn btn-ghost btn-sm" onclick="logout()" style="display:flex;align-items:center;gap:5px;">'+IC.logout+' Sair</button>'
    +'</div>'
    +'<div id="content">'+content+'</div>'
    +'<div class="bnav">'+bnav+'</div>'
    +'</div></div>'+modal;

  var hash=window.location.hash;
  if(hash.indexOf('#p=')===0){
    var pid=hash.slice(3);
    var found=S.purifiers.filter(function(x){return x.id===pid;})[0];
    if(found&&(!S.selP||S.selP.id!==pid)){S.selP=found;S.view='pd';window.location.hash='';render();}
  }
}

window.addEventListener('hashchange',function(){
  var h=window.location.hash;
  if(h.indexOf('#p=')===0){
    var pid=h.slice(3);
    var p=S.purifiers.filter(function(x){return x.id===pid;})[0];
    if(p){S.selP=p;S.view='pd';window.location.hash='';render();}
  }
});
window.addEventListener('resize',render);
if(FB_OK&&db)startListeners();
render();
</script>
</body>
</html>
